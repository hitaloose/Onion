# Built-in gamepad of the Anbernic RG35XX (original), read by the SDL joypad
# driver from /dev/input/js0. joydev numbers buttons in keycode order:
# BTN_A 0, BTN_B 1, BTN_X 2, BTN_Y 3, BTN_Z 4 (sent with power), BTN_TL 5,
# BTN_TR 6, BTN_SELECT 7, BTN_START 8, BTN_MODE 9 (MENU), BTN_THUMBL 10 (VOL+),
# BTN_THUMBR 11 (VOL-). L2/R2 are axes 2/5 (0 or 255), the d-pad is hat 0.
# MENU, power and volume are handled by keymon.
input_driver = "sdl"
input_device = "RG35XX Gamepad"
input_device_display_name = "RG35XX"

input_a_btn = "0"
input_b_btn = "1"
input_x_btn = "2"
input_y_btn = "3"
input_l_btn = "5"
input_r_btn = "6"
input_l2_axis = "+2"
input_r2_axis = "+5"
input_select_btn = "7"
input_start_btn = "8"
input_up_btn = "h0up"
input_down_btn = "h0down"
input_left_btn = "h0left"
input_right_btn = "h0right"

input_a_btn_label = "A"
input_b_btn_label = "B"
input_x_btn_label = "X"
input_y_btn_label = "Y"
input_l_btn_label = "L1"
input_r_btn_label = "R1"
input_l2_axis_label = "L2"
input_r2_axis_label = "R2"
input_select_btn_label = "SELECT"
input_start_btn_label = "START"
